name: one-time-lint-cleanup
on:
  push:
    paths:
      - '.github/workflows/one-time-lint-cleanup.yml'

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove unused icon imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace('CircleDot, Clock3, FileCheck2, FileSearch, Fingerprint, GitBranch, History,', 'CircleDot, FileCheck2, FileSearch, Fingerprint, GitBranch,')
          p.write_text(s)
          PY
      - name: Commit clean source and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-lint-cleanup.yml
          git add src/App.tsx
          git commit -m "chore: remove unused icon imports"
          git push
