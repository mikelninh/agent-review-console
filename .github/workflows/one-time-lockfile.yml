name: one-time-lockfile
on:
  push:
    paths:
      - '.github/workflows/one-time-lockfile.yml'

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mikelninh@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: pin frontend dependency graph"
          git push
