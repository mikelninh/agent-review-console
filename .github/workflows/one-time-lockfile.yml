name: one-time-lockfile
on:
  push:
    paths:
      - '.github/workflows/one-time-lockfile.yml'

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Switch release gate to npm ci
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text().replace('npm install --no-audit --no-fund', 'npm ci --no-audit --no-fund')
          p.write_text(s)
          PY
      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-lockfile.yml
          git add package-lock.json .github/workflows/ci.yml
          git commit -m "build: pin dependencies and enforce npm ci"
          git push
