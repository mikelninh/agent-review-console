name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm install --no-audit --no-fund
      - name: Lint gate
        run: npm run lint
      - name: TypeScript gate
        run: npm run typecheck
      - name: Frontend state-machine tests
        run: npm test
      - run: pip install -r requirements-dev.txt
      - name: Backend tests + agent evals
        run: pytest -q tests evals
      - name: Production build gate
        run: npm run build
      - name: Preserve verified build evidence
        uses: actions/upload-artifact@v7
        with:
          name: verified-build
          path: |
            dist
            evidence/verification.v0.1.0.json
            package-lock.json
          if-no-files-found: error
