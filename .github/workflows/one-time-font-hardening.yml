name: one-time-font-hardening
on:
  push:
    paths:
      - '.github/workflows/one-time-font-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove external font dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles.css')
          s = p.read_text()
          s = s.replace("@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');\n", '')
          s = s.replace('font-family:Inter,ui-sans-serif,system-ui,sans-serif', 'font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif')
          s = s.replace("'DM Mono',monospace", 'ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace')
          p.write_text(s)
          PY
      - name: Commit hardened source and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-font-hardening.yml
          git add src/styles.css
          git commit -m "style: remove external font dependency"
          git push
