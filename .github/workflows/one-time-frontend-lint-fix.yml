name: one-time-frontend-lint-fix
on:
  push:
    branches: [design/frontend-2]
    paths:
      - '.github/workflows/one-time-frontend-lint-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: design/frontend-2
      - name: Remove unused import
        run: sed -i '/  FileCheck2,/d' src/App.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: remove unused frontend icon import"
          git push origin HEAD:design/frontend-2
