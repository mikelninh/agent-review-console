name: one-time-retry-regression-fix
on:
  push:
    branches: [design/frontend-2]
    paths:
      - '.github/workflows/one-time-retry-regression-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: design/frontend-2
      - name: Fix retry orchestration and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()
          old = """      setReview(prev => ({\n        ...prev,\n        status: 'running',\n        failure: undefined,\n        trace: [\n"""
          new = """      setReview(prev => ({\n        ...prev,\n        trace: [\n"""
          if old not in s:
              raise SystemExit('retry preflight block not found')
          app.write_text(s.replace(old, new, 1))

          tests = Path('src/lib/workflow.test.ts')
          t = tests.read_text()
          anchor = """  it('prevents duplicate final decisions', () => {\n"""
          regression = """  it('keeps a failed run recoverable until the retry stream confirms restart', () => {\n    const degraded = emptyRun('degraded')\n    const paused = {\n      ...degraded,\n      status: 'paused' as const,\n      failure: { title: 'Evidence service unavailable', detail: 'HTTP 503', preserved: '2 evidence items preserved' }\n    }\n    const retryRequested = {\n      ...paused,\n      trace: [...paused.trace, { time: 'now', actor: 'Human reviewer', title: 'Retry requested', detail: 'Resume from failure boundary', tone: 'human' as const }]\n    }\n\n    const fallbackRecovered = retryDegraded(retryRequested)\n    expect(fallbackRecovered.status).toBe('awaiting_human')\n    expect(fallbackRecovered.failure).toBeUndefined()\n\n    const liveRestarted = applyApiEvent(retryRequested, { type: 'run.started', run_id: retryRequested.runId, mode: 'degraded' })\n    expect(liveRestarted.status).toBe('running')\n    expect(liveRestarted.failure).toBeUndefined()\n  })\n\n"""
          if anchor not in t:
              raise SystemExit('test anchor not found')
          tests.write_text(t.replace(anchor, regression + anchor, 1))
          PY
      - name: Commit regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/lib/workflow.test.ts
          git commit -m "fix: preserve retry recovery boundary during API fallback"
          git push origin HEAD:design/frontend-2
